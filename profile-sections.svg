<svg width="1200" height="720" viewBox="0 0 1200 720"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17131f"/>
      <stop offset="45%" stop-color="#211827"/>
      <stop offset="100%" stop-color="#15121c"/>
    </linearGradient>

    <radialGradient id="lavGlow">
      <stop offset="0%" stop-color="#c9a8ff" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#b99ae8" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#b99ae8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#f2a9cc" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#e4a2c1" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#e4a2c1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6a8ff" stop-opacity=".05"/>
      <stop offset="45%" stop-color="#e9afd0" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#c6a8ff" stop-opacity=".05"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1b5d2"/>
      <stop offset="100%" stop-color="#cbb5ff"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>


  <!-- AMBIENT LIGHT -->

  <circle cx="170" cy="150" r="180"
          fill="url(#pinkGlow)"
          filter="url(#blur)">

    <animate attributeName="cx"
             values="170;230;170"
             dur="14s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="150;190;150"
             dur="11s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="1030" cy="500" r="220"
          fill="url(#lavGlow)"
          filter="url(#blur)">

    <animate attributeName="cx"
             values="1030;960;1030"
             dur="16s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="500;450;500"
             dur="13s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ORGANIC LINES -->

  <path
    d="M-50 185
       C150 75 270 290 455 180
       S760 55 930 155
       S1130 230 1250 130"
    fill="none"
    stroke="url(#line)"
    stroke-width="1.4"
    opacity=".8">

    <animate
      attributeName="d"
      dur="18s"
      repeatCount="indefinite"
      values="
      M-50 185 C150 75 270 290 455 180 S760 55 930 155 S1130 230 1250 130;
      M-50 205 C160 105 280 270 460 195 S750 75 925 175 S1135 250 1250 145;
      M-50 185 C150 75 270 290 455 180 S760 55 930 155 S1130 230 1250 130"/>
  </path>


  <path
    d="M-80 565
       C120 470 255 635 440 550
       S750 430 910 535
       S1110 625 1270 500"
    fill="none"
    stroke="#d9b3e5"
    stroke-opacity=".16"
    stroke-width="1.2">

    <animate
      attributeName="d"
      dur="21s"
      repeatCount="indefinite"
      values="
      M-80 565 C120 470 255 635 440 550 S750 430 910 535 S1110 625 1270 500;
      M-80 545 C130 450 265 615 445 570 S745 455 920 555 S1120 600 1270 520;
      M-80 565 C120 470 255 635 440 550 S750 430 910 535 S1110 625 1270 500"/>
  </path>


  <!-- STARS -->

  <g fill="#f4d8ea">

    <g>
      <path d="M105 105 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -12; 0 0"
        dur="5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".25;1;.25"
        dur="5s"
        repeatCount="indefinite"/>
    </g>


    <g>
      <path d="M1090 115 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -8 8; 0 0"
        dur="7s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;.9;.2"
        dur="7s"
        repeatCount="indefinite"/>
    </g>


    <g>
      <path d="M1020 330 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 10 -10; 0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </g>


    <g>
      <path d="M145 500 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>

      <animate
        attributeName="opacity"
        values=".15;.8;.15"
        dur="4s"
        repeatCount="indefinite"/>
    </g>

  </g>


  <!-- FLOATING DOTS -->

  <g fill="#d7baff">

    <circle cx="280" cy="105" r="2">
      <animate attributeName="cy"
               values="105;88;105"
               dur="8s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="8s"
               repeatCount="indefinite"/>
    </circle>


    <circle cx="875" cy="230" r="2">
      <animate attributeName="cy"
               values="230;212;230"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>


    <circle cx="330" cy="455" r="1.8">
      <animate attributeName="cx"
               values="330;350;330"
               dur="9s"
               repeatCount="indefinite"/>
    </circle>


    <circle cx="950" cy="600" r="2">
      <animate attributeName="cy"
               values="600;580;600"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ============================== -->
  <!-- PERSONAL INTRO -->
  <!-- ============================== -->

  <text x="90" y="135"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="3"
        fill="#c9b8cf">
    A LITTLE ABOUT ME
  </text>


  <text x="90" y="180"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#f5eaf3">
    curious · experimental · always building
  </text>


  <text x="90" y="215"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#c8bdce">
    learning by making things instead of just reading about them
  </text>


  <text x="90" y="247"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#a99dad">
    somewhere between “i have an idea” and “why isn't this working?” ♡
  </text>


  <!-- ============================== -->
  <!-- CURRENTLY OBSESSED -->
  <!-- ============================== -->

  <text x="90" y="350"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="3"
        fill="#c9b8cf">
    CURRENTLY OBSESSED WITH
  </text>


  <text x="90" y="400"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="url(#text)">
    ✦ AI / ML
  </text>


  <text x="90" y="435"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="url(#text)">
    ✦ building from scratch
  </text>


  <text x="90" y="470"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="url(#text)">
    ✦ weird solutions
  </text>


  <text x="90" y="505"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="url(#text)">
    ✦ random ideas worth trying
  </text>


  <!-- ============================== -->
  <!-- LITTLE DEV UNIVERSE -->
  <!-- ============================== -->

  <text x="590" y="350"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="3"
        fill="#c9b8cf">
    LITTLE DEV THOUGHTS
  </text>


  <text x="590" y="400"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#f1e7f1">
    “this should be easy”
  </text>


  <text x="590" y="432"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#a99dad">
    ↓
  </text>


  <text x="590" y="465"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#d8c6df">
    3 hours later
  </text>


  <text x="590" y="497"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#a99dad">
    ↓
  </text>


  <text x="590" y="530"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="700"
        fill="url(#text)">
    somehow it works ♡
  </text>


  <!-- ============================== -->
  <!-- FLOATING PERSONAL NOTES -->
  <!-- ============================== -->

  <text x="865" y="390"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#b9adbd">

    ☕ coffee → code

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 5 -7; 0 0"
      dur="7s"
      repeatCount="indefinite"/>

  </text>


  <text x="865" y="425"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#b9adbd">

    ♡ learn by building

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; -5 6; 0 0"
      dur="8s"
      repeatCount="indefinite"/>

  </text>


  <text x="865" y="460"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#b9adbd">

    ✦ collecting ideas

    <animate
      attributeName="opacity"
      values=".45;1;.45"
      dur="5s"
      repeatCount="indefinite"/>

  </text>


  <!-- ============================== -->
  <!-- CONSTELLATION -->
  <!-- ============================== -->

  <g stroke="#d6bdf0"
     stroke-opacity=".2"
     stroke-width="1">

    <line x1="910" y1="150" x2="970" y2="115"/>
    <line x1="970" y1="115" x2="1030" y2="165"/>
    <line x1="1030" y1="165" x2="1090" y2="130"/>
    <line x1="970" y1="115" x2="1000" y2="205"/>

  </g>


  <g fill="#e9c7df">

    <circle cx="910" cy="150" r="3"/>
    <circle cx="970" cy="115" r="4"/>
    <circle cx="1030" cy="165" r="3"/>
    <circle cx="1090" cy="130" r="3"/>
    <circle cx="1000" cy="205" r="3"/>

  </g>


  <!-- ============================== -->
  <!-- CLOSING -->
  <!-- ============================== -->

  <path
    d="M90 590
       C260 550 390 640 560 595
       S850 550 1080 605"
    fill="none"
    stroke="url(#line)"
    stroke-width="1"/>


  <text x="90" y="650"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#f1e7f1">
    if an idea sounds interesting,
  </text>


  <text x="90" y="680"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="url(#text)">
    i'll probably try to build it ♡
  </text>


  <!-- FINAL HEART -->

  <text x="1080" y="660"
        font-family="Arial, sans-serif"
        font-size="22"
        fill="#e9acd0">

    ♡

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -8; 0 0"
      dur="4s"
      repeatCount="indefinite"/>

  </text>

</svg>